[package]
name = "mfg-unlocker-gui"
version = "1.0.0"
description = "Companion app for MFG Unlocker"
authors = ["lashman"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "mfg_unlocker_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
zip = "5.0.1"
sha2 = "0.10.9"
winreg = "0.56.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
